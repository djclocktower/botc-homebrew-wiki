<!DOCTYPE html>
<html lang="en" class="redesign-on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggested Edits — BOTC HomeBrew Wiki</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/header-redesign.css">
<style>
  .sg-sub { font-family:'TradeGothicLT','Libre Franklin',sans-serif;
    color:rgba(236,225,200,.8); text-align:center; margin:0 0 4px; font-size:.95rem; }
  .sg-sub a { color:#9fc4ee; }
  .sg-back { display:block; text-align:center; margin:10px 0 0;
    font-family:'Oswald',sans-serif; letter-spacing:.03em; color:var(--parch); text-decoration:none; }
  .sg-back:hover { color:#fff; text-decoration:underline; }
  .sg-note-msg { text-align:center; color:rgba(236,225,200,.85); padding:36px 20px;
    font-family:'TradeGothicLT','Libre Franklin',sans-serif; }
  .sg-note-msg a { color:#9fc4ee; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <a class="brand" href="/">
        <img class="brand-skull" src="assets/logo_skull.png" alt="">
        <img class="brand-header-text" src="assets/headertext.png" alt="BOTC HomeBrew Wiki">
      </a>
      <img class="topbar-badge" src="assets/ccc-parchment.png" alt="Community Created Content">
    </div>
    <nav class="crumb" aria-label="Primary">
      <a href="all-characters">All Characters</a>
      <a href="scripts">Scripts</a>
      <a href="all-collections">Collections</a>
      <a href="script">Script Builder</a>
    </nav>
    <div class="search-wrap" id="search-wrap">
      <input class="search-input" id="search-input" type="search" placeholder="Search characters…" autocomplete="off" aria-label="Search characters" aria-expanded="false" aria-haspopup="listbox">
      <div class="search-drop" id="search-drop" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>
  <nav class="nav-dropdown" id="nav-dropdown" aria-label="Mobile navigation">
    <div class="nav-dropdown-search">
      <input type="search" id="nav-search-input" placeholder="Search characters…" autocomplete="off">
    </div>
    <a href="/">Home</a>
    <a href="all-characters">All Characters</a>
    <a href="scripts">Scripts</a>
    <a href="all-collections">Collections</a>
    <a href="script">Script Builder</a>
  </nav>

  <div class="home-hero">
    <h1 id="sg-title">Suggested Edits</h1>
    <p class="sg-sub" id="sg-page"></p>
    <a class="sg-back" id="sg-link" href="#" style="display:none">← Back to the page</a>
  </div>

  <main class="home-panel">
    <div class="sg-note-msg" id="loading">Loading…</div>
    <div class="sg-note-msg" id="error" style="display:none"></div>
    <div class="card hist-card" id="card" style="display:none">
      <div id="list"></div>
      <p class="hist-empty" id="empty" style="display:none">Nothing waiting.</p>
    </div>
  </main>

  <p class="foot">Fan-made content for <em>Blood on the Clocktower</em> &middot; Not affiliated with The Pandemonium Institute</p>

  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    var q = new URLSearchParams(location.search);
    var TYPE = q.get('type') || '';
    var SLUG = q.get('slug') || '';
    var INBOX = !TYPE || !SLUG;   // no page named: everything waiting on you
    var PATHS = { character: 'c/', script: 's/', collection: 'collection/', wikipage: 'p/' };
    var data = null;

    function when(ts) {
      if (!ts) return '';
      var d = new Date(String(ts).replace(' ', 'T') + 'Z');
      if (isNaN(d)) return String(ts);
      return d.toLocaleString(undefined, { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }
    function pageHref(type, slug) { return (PATHS[type] || 'c/') + encodeURIComponent(slug); }

    /* ── the inbox: open suggestions on every page you own ── */
    function renderInbox(rows) {
      $('sg-title').textContent = 'Suggested Edits';
      $('sg-page').textContent = rows.length
        ? 'People have proposed changes to your pages. Nothing is live until you approve it.'
        : 'When somebody proposes a change to one of your pages, it waits here.';
      $('card').style.display = '';
      $('empty').style.display = rows.length ? 'none' : '';
      $('list').innerHTML = rows.map(function (r) {
        return '<div class="sg-inbox-row">' +
          '<div class="sg-inbox-main">' +
            '<a class="sg-inbox-name" href="suggestions?type=' + esc(r.entity_type) +
              '&slug=' + encodeURIComponent(r.slug) + '">' + esc(r.name || r.slug) + '</a>' +
            '<span class="sg-inbox-meta">' + esc(r.username || 'someone') + ' &middot; ' + esc(when(r.ts)) + '</span>' +
            (r.note ? '<span class="sg-inbox-note">&ldquo;' + esc(r.note) + '&rdquo;</span>' : '') +
          '</div>' +
          '<a class="hist-btn" href="suggestions?type=' + esc(r.entity_type) +
            '&slug=' + encodeURIComponent(r.slug) + '">Review</a>' +
        '</div>';
      }).join('');
    }

    /* ── one page's suggestions ── */
    function statusChip(s) {
      var label = { open:'waiting', approved:'approved', declined:'declined', withdrawn:'withdrawn' }[s] || s;
      return '<span class="sg-chip sg-' + esc(s) + '">' + esc(label) + '</span>';
    }
    function changeHTML(changes) {
      if (!changes || !changes.length) return '<p class="hist-nochange">Nothing would change.</p>';
      return changes.map(function (f) {
        return '<div class="hist-field">' +
          '<div class="hist-field-name">' + esc(f.label) + '</div>' +
          '<div class="hist-was"><span class="hist-tag">now</span><span>' + (f.before ? esc(f.before) : '<em>empty</em>') + '</span></div>' +
          '<div class="hist-now"><span class="hist-tag">suggested</span><span>' + (f.after ? esc(f.after) : '<em>empty</em>') + '</span></div>' +
        '</div>';
      }).join('');
    }
    function renderPage() {
      $('sg-title').textContent = 'Suggestions for ' + (data.name || SLUG);
      $('sg-page').innerHTML = data.canReview
        ? 'Proposed by other people. Nothing is live until you approve it. <a href="' + esc(pageHref(TYPE, SLUG)) + '">View the page →</a>'
        : 'Your suggestions for this page. <a href="' + esc(pageHref(TYPE, SLUG)) + '">View the page →</a>';
      $('sg-link').style.display = '';
      $('sg-link').href = pageHref(TYPE, SLUG);
      var rows = data.suggestions || [];
      $('card').style.display = '';
      $('empty').style.display = rows.length ? 'none' : '';
      $('empty').textContent = data.canReview
        ? 'No suggestions on this page yet.'
        : 'You have not suggested anything on this page.';
      $('list').innerHTML = rows.map(function (r) {
        var acts = '';
        if (r.status === 'open' && data.canReview) {
          acts = '<div class="sg-acts">' +
            '<input type="text" class="sg-reply" id="reply' + r.id + '" maxlength="600" placeholder="A reply (optional)">' +
            '<button type="button" class="hist-btn sg-approve" data-id="' + r.id + '">Approve &amp; apply</button>' +
            '<button type="button" class="hist-btn sg-decline" data-id="' + r.id + '">Decline</button>' +
            '</div>';
        } else if (r.status === 'open' && r.mine) {
          acts = '<div class="sg-acts"><button type="button" class="hist-btn sg-withdraw" data-id="' + r.id + '">Withdraw</button></div>';
        }
        return '<div class="sg-row" data-id="' + r.id + '">' +
          '<div class="sg-head">' +
            '<span class="sg-who">' + esc(r.by || 'someone') + '</span> ' +
            '<span class="sg-when">' + esc(when(r.ts)) + '</span> ' + statusChip(r.status) +
            (r.stale ? '<span class="sg-chip sg-stale" title="The page has changed since this was written — approving it replaces what is there now.">written against an older version</span>' : '') +
          '</div>' +
          (r.note ? '<p class="sg-note">&ldquo;' + esc(r.note) + '&rdquo;</p>' : '') +
          (r.reply ? '<p class="sg-reply-said"><strong>' + esc(r.decidedBy || 'The creator') + ':</strong> &ldquo;' + esc(r.reply) + '&rdquo;</p>' : '') +
          '<div class="sg-changes">' + changeHTML(r.changes) + '</div>' +
          acts +
        '</div>';
      }).join('');
    }

    function act(id, action, btn) {
      var reply = $('reply' + id) ? $('reply' + id).value.trim() : '';
      if (action === 'approve' && !confirm('Apply this suggestion to the page?\n\nThe version on the page now is saved to its history first, so you can put it back.')) return;
      if (action === 'decline' && !confirm('Decline this suggestion?')) return;
      if (action === 'withdraw' && !confirm('Withdraw your suggestion?')) return;
      var row = btn.closest('.sg-row');
      row.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      fetch('/api/suggestion', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, action: action, reply: reply })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res || res.error) throw new Error((res && res.error) || 'That did not work.');
          location.reload();
        })
        .catch(function (err) {
          row.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
          alert(err.message);
        });
    }
    document.addEventListener('click', function (ev) {
      var b = ev.target.closest && ev.target.closest('.sg-approve, .sg-decline, .sg-withdraw');
      if (!b) return;
      var action = b.classList.contains('sg-approve') ? 'approve'
        : b.classList.contains('sg-decline') ? 'decline' : 'withdraw';
      act(parseInt(b.getAttribute('data-id'), 10), action, b);
    });

    var url = INBOX ? '/api/suggestions?inbox=1'
      : '/api/suggestions?type=' + encodeURIComponent(TYPE) + '&slug=' + encodeURIComponent(SLUG);
    fetch(url, { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        $('loading').style.display = 'none';
        if (!res || res.error) {
          $('error').style.display = '';
          $('error').innerHTML = esc((res && res.error) || 'Could not load that.') +
            (res && res.error === 'Not logged in.' ? '<br><a href="login">Log in</a>' : '');
          return;
        }
        if (INBOX) renderInbox(res.inbox || []);
        else { data = res; renderPage(); }
      })
      .catch(function () {
        $('loading').style.display = 'none';
        $('error').style.display = '';
        $('error').textContent = 'Could not load that.';
      });
  })();
  </script>

  <script src="assets/site.js"></script>
</body>
</html>
