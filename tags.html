<!-- The counts this page draws start downloading here, while the
     stylesheet and scripts are still on their way, instead of after the
     scripts at the end of the body have run. `crossorigin` has to be there
     for the preload to match a plain fetch(). It is /api/tag-counts — a
     kilobyte or two — not the whole character feed this page used to
     download just to count tags. -->
<link rel="preload" href="api/tag-counts" as="fetch" crossorigin="anonymous">
<link rel="stylesheet" href="assets/header-redesign.css">
</head>
<body>

        <img class="brand-skull" src="assets/logo_skull.webp" alt="">
        <img class="brand-header-text" src="assets/headertext.png" alt="BOTC HomeBrew Wiki">

    </div>
    <nav class="crumb" aria-label="Primary">
      <a href="all-characters">All Characters</a>

    </nav>

  <div class="home-hero">
    <h1>Tags</h1>
    <p>Browse characters by tag</p>
  </div>

  <main class="home-panel" id="panel">
    <p style="text-align:center;color:rgba(236,225,200,.7);padding:30px">Loading tags…</p>
  </main>

  <p class="foot">Fan-made content for <em>Blood on the Clocktower</em> &middot; Not affiliated with The Pandemonium Institute</p>

  <script src="assets/tags.js"></script>
  <script>
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;')
        .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Canonical tag list + descriptions live in assets/tags.js
    var KNOWN_TAGS = window.KNOWN_TAGS || [];

    // Counted on the server (GET /api/tag-counts, one entry per title-cased
    // tag, published characters, Partial included) — the same count this page
    // used to make itself from the whole character feed.
    BotcData.json('api/tag-counts')
      .then(function(res) {
        var counts = (res && res.tags) || {};
        if (typeof counts !== 'object') throw new Error('Invalid tag counts');
        // Seed tagMap from KNOWN_TAGS, then overlay real counts
        var tagMap = {};
        KNOWN_TAGS.forEach(function(t) { tagMap[t] = 0; });
        Object.keys(counts).forEach(function(key) {
          tagMap[key] = (tagMap[key] || 0) + (+counts[key] || 0);
        });

        var panel = document.getElementById('panel');
        // Only show tags that at least one character actually has —
        // zero-count pills would just link to empty pages.
        var tags = Object.keys(tagMap).filter(function(t) { return tagMap[t] > 0; }).sort();

        panel.innerHTML =
          '<div class="tags-index">' +
          tags.map(function(tag) {
            var count = tagMap[tag];
            return '<a class="tag-pill" data-tag="' + esc(tag) + '" href="tag?t=' + encodeURIComponent(tag) + '">' +
              esc(tag) +
              '<span class="tag-count">' + count + '</span>' +
              '</a>';
          }).join('') +
          '</div>';
      })
      .catch(function() {
        document.getElementById('panel').innerHTML =
          '<p style="text-align:center;color:#e6a;padding:30px">Could not load tags.</p>';
      });
  </script>

  <script src="assets/site.js"></script>
</body>
</html>
