<!DOCTYPE html>
<html lang="en" class="redesign-on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator — BOTC HomeBrew Wiki</title>
<meta name="description" content="A creator on the BOTC HomeBrew Wiki — their characters, scripts, and collections for Blood on the Clocktower.">
<!--
  ONE page for two URLs. /u/{username} is an account's creator page;
  /author?a=Name is the same page keyed on the free-text "Creator" field that
  every character info box, credits list and the homepage creator strip links
  to. The Worker 302s /author?a= to /u/ when the name belongs to an account
  (see the /author route in worker/worker.js) and serves this file directly
  when it does not — half the wiki was bulk-imported under names with no
  account behind them, and those creators get a page too.

  Served from both paths, so every path in here is absolute.
-->
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/header-redesign.css">
<style>
  .profile-hero { display:flex; align-items:center; gap:22px; flex-wrap:wrap; justify-content:center; text-align:left; }
  .profile-avatar {
    width:86px; height:86px; border-radius:50%; flex-shrink:0;
    background:var(--maroon, #5b1f21); color:#f7ecd0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Dumbledor2',serif; font-size:2.2rem;
    border:2px solid rgba(236,225,200,.4);
  }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-hero-text { min-width:0; max-width:100%; }
  /* .home-hero centres its text; the hero here is a two-column card, so the
     name lines up with the details under it instead of floating over them.
     Size comes from .home-hero h1; fitHeroName() below shrinks it when the
     name is too long for the width, and styles.css lets it wrap if even that
     is not enough. */
  .profile-hero-text h1 { margin:0 0 2px; text-align:left; }
  .profile-uname { font-size:.95rem; color:rgba(236,225,200,.75); margin:0 0 6px; }
  .profile-bio { font-size:.95rem; color:rgba(236,225,200,.9); max-width:60ch; margin:0 0 6px; white-space:pre-wrap; }
  .profile-joined { font-size:.82rem; color:rgba(236,225,200,.6); margin:0; }
  .profile-aka { font-size:.82rem; color:rgba(236,225,200,.6); margin:0 0 6px; }
  /* Collapsible sections. A creator with 258 characters made Scripts and
     Collections a very long scroll away; the heading is a toggle now.
     Everything starts open, so the page reads exactly as it did before
     anyone touches it. */
  .prof-sec-toggle {
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:none; padding:0; margin:0; cursor:pointer;
    font:inherit; color:inherit; letter-spacing:inherit;
    text-transform:inherit; text-align:left;
  }
  .prof-sec-toggle:hover { color:#fff; }
  .prof-sec-toggle:focus-visible { outline:2px solid rgba(236,225,200,.6); outline-offset:3px; }
  .prof-sec-caret {
    flex:0 0 auto; font-size:.7em; line-height:1;
    color:rgba(236,225,200,.65); transition:transform .15s ease;
  }
  .prof-sec-count {
    flex:0 0 auto; margin-left:auto;
    font-family:'Oswald',sans-serif; font-size:.62em; letter-spacing:.06em;
    color:rgba(236,225,200,.55); text-transform:uppercase;
  }
  .prof-section.collapsed .prof-sec-caret { transform:rotate(-90deg); }
  .prof-section.collapsed .prof-sec-body { display:none; }
  .prof-section.collapsed .type-rule { margin-bottom:10px; }
  @media (prefers-reduced-motion: reduce) { .prof-sec-caret { transition:none; } }
  .profile-empty { text-align:center; color:rgba(236,225,200,.7); padding:30px; }
  .profile-unclaimed { font-size:.88rem; color:rgba(236,225,200,.6); margin:2px 0 6px; max-width:56ch; }
  .profile-btn-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .profile-msg-btn {
    display:inline-block; padding:7px 16px;
    font-family:'TradeGothicLT','Libre Franklin',sans-serif; font-weight:700; font-size:.88rem;
    color:#f4ead2; background:linear-gradient(180deg,#7a2d2f,#5b1f21);
    border:1px solid rgba(236,225,200,.35); border-radius:6px; text-decoration:none;
  }
  .profile-msg-btn:hover { background:linear-gradient(180deg,#8a3537,#6b2527); }
  .profile-msg-btn.ghost { background:none; color:rgba(236,225,200,.9); }
  .profile-msg-btn.ghost:hover { background:rgba(236,225,200,.1); }
  /* Links the creator added in their account settings. */
  .profile-links { display:flex; flex-wrap:wrap; gap:12px; margin:6px 0 0; padding:0; list-style:none; }
  .profile-links li { margin:0; padding:0; }
  .profile-links li::before { display:none; }
  .profile-links a, .profile-links span {
    font-size:.85rem; color:rgba(236,225,200,.85); text-decoration:none;
    border-bottom:1px solid rgba(236,225,200,.3);
  }
  .profile-links a:hover { color:#ffe9ad; }
  .profile-links .plink-icon { border:none; margin-right:5px; opacity:.7; }
  /* Admin-only box for linking a creator name to an account. */
  .creator-link-box {
    margin:14px auto 0; max-width:520px; padding:10px 12px; text-align:left;
    background:rgba(0,0,0,.25); border:1px solid rgba(236,225,200,.25);
    font-size:.84rem; color:rgba(236,225,200,.85);
  }
  .creator-link-box form { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .creator-link-box input {
    flex:1 1 160px; min-width:0; padding:5px 8px; font-size:.85rem;
    background:#1c1018; color:#f0e6cd; border:1px solid rgba(236,225,200,.3);
  }
  .creator-link-box button {
    padding:5px 12px; font-size:.82rem; font-weight:700; cursor:pointer;
    background:#5b1f21; color:#f4ead2; border:1px solid rgba(236,225,200,.35);
  }
  .creator-link-msg { margin:6px 0 0; font-size:.82rem; }
  /* Pinned strip — one uniform card, because a pin can be any of the three types. */
  .pin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .pin-card {
    display:flex; align-items:center; gap:10px; padding:10px 12px; text-decoration:none;
    background:var(--parch,#F0E8D5); border:2px solid var(--parch-frame,#bda89a); color:var(--maroon);
  }
  .pin-card:hover { background:#f7f1e2; }
  .pin-thumb { width:40px; height:40px; object-fit:contain; flex-shrink:0; }
  .pin-text { min-width:0; }
  .pin-name {
    display:block; font-family:'Dumbledor2',serif; font-size:1.05rem; letter-spacing:.04em;
    text-transform:uppercase; line-height:1.15; overflow-wrap:anywhere;
  }
  .pin-kind { display:block; font-size:.74rem; font-family:'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase; opacity:.6; }
  .cr-chars-count { text-align:center; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <a class="brand" href="/">
        <img class="brand-skull" src="/assets/logo_skull.png" alt="">
        <img class="brand-header-text" src="/assets/headertext.png" alt="BOTC HomeBrew Wiki">
      </a>
      <img class="topbar-badge" src="/assets/ccc-parchment.png" alt="Community Created Content">
    </div>
    <nav class="crumb" aria-label="Primary">
      <a href="/all-characters">All Characters</a>
      <a href="/scripts">Scripts</a>
      <a href="/all-collections">Collections</a>
      <a href="/script">Script Builder</a>
    </nav>
    <div class="search-wrap" id="search-wrap">
      <input class="search-input" id="search-input" type="search" placeholder="Search characters…" autocomplete="off" aria-label="Search characters" aria-expanded="false" aria-haspopup="listbox">
      <div class="search-drop" id="search-drop" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>
  <nav class="nav-dropdown" id="nav-dropdown" aria-label="Mobile navigation">
    <div class="nav-dropdown-search">
      <input type="search" id="nav-search-input" placeholder="Search characters…" autocomplete="off">
    </div>
    <a href="/">Home</a>
    <a href="/all-characters">All Characters</a>
    <a href="/scripts">Scripts</a>
    <a href="/all-collections">Collections</a>
    <a href="/script">Script Builder</a>
  </nav>

  <div class="home-hero">
    <div class="profile-hero" id="profile-hero">
      <h1 id="hero-loading">Loading…</h1>
    </div>
  </div>

  <main class="home-panel" id="panel"></main>

  <p class="foot">Fan-made content for <em>Blood on the Clocktower</em> &middot; Not affiliated with The Pandemonium Institute</p>

  <script src="/assets/render-page.js"></script>
  <!-- sao.js first: card-filters.js only offers Steven Approved Order when
       window.saoCompare is already defined. -->
  <script src="/assets/sao.js"></script>
  <script src="/assets/card-filters.js"></script>
  <script>
  (function () {
    var PR = window.PageRender;

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    /* Fit the creator name to one line, then stop. Creator names are
       user-supplied and some are a single unbroken word, which at hero size
       ran off the side of a phone and dragged the page with it. Measured
       rather than computed, the way fitCharTitle does it for character
       titles. Below MIN_NAME_PX shrinking stops being readable, so it wraps
       instead — styles.css allows the break. */
    var MIN_NAME_PX = 22;
    function fitHeroName() {
      var el = document.querySelector('.profile-hero-text h1');
      if (!el) return;
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize = '';                        // back to the CSS clamp
      var avail = el.clientWidth;
      if (!avail) return;
      if (el.scrollWidth > avail) {
        var cur = parseFloat(getComputedStyle(el).fontSize) || 24;
        var size = cur * (avail * 0.98) / el.scrollWidth;
        el.style.fontSize = Math.max(size, MIN_NAME_PX).toFixed(1) + 'px';
      }
      // Whatever the arithmetic said, never leave it overflowing: if one line
      // still does not fit at the smallest size worth reading, let it wrap.
      // (styles.css allows the break; that is the safety net under all of this.)
      el.style.whiteSpace = el.scrollWidth > el.clientWidth + 1 ? 'normal' : 'nowrap';
    }
    // Dumbledor2's glyphs are wider than the fallback and it arrives after
    // first paint, so the first measurement is always against the wrong font.
    // Re-fit when it lands — unconditionally, because fonts.status can already
    // read "loaded" at this point and still repaint wider afterwards.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitHeroName).catch(function () {});
    }
    window.addEventListener('resize', fitHeroName);

    function fmtDate(d) {
      if (!d) return '';
      var t = new Date(String(d).replace(' ', 'T') + (String(d).indexOf('Z') === -1 ? 'Z' : ''));
      if (isNaN(t)) return String(d).slice(0, 10);
      return t.toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
    }
    function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

    // Two keys, one page: /u/{username} for an account, /author?a=Name for a
    // creator credit. ?u= still works for a direct profile.html visit.
    var m = location.pathname.match(/^\/u\/([^\/]+)\/?$/);
    var params = new URLSearchParams(location.search);
    var username = m ? decodeURIComponent(m[1]) : (params.get('u') || '');
    var authorName = username ? '' : (params.get('a') || '');

    var hero = document.getElementById('profile-hero');
    var panel = document.getElementById('panel');

    function fail(msg) {
      hero.innerHTML = '<h1>Creator not found</h1>';
      panel.innerHTML = '<p class="profile-empty">' + esc(msg) +
        ' <a href="/creators" style="color:#7fb2e6">Browse all creators</a>.</p>';
    }
    if (!username && !authorName) { fail('No creator specified.'); return; }

    /* ── tiles ── */
    function scriptTile(sc) {
      var n = sc.characters || 0;
      var href = '/s/' + encodeURIComponent(sc.slug);
      // Header image, then the logo, then the name drawn as a banner —
      // the same order the /s/ page itself falls back through.
      // --nch (letter count, spaces collapsed) drives the banner text's
      // font-size in styles.css, so a long name shrinks to fit the 21:9
      // box instead of being clipped. Same trick as the /c/ page title.
      var nch = Math.max(String(sc.name || '').replace(/\s+/g, ' ').trim().length, 4);
      var headerHTML = sc.header || sc.logo
        ? '<div class="script-card-header"><img loading="lazy" decoding="async" src="/assets/' + esc(sc.header || sc.logo) + '" alt="' + esc(sc.name) + '"></div>'
        : '<div class="script-card-header script-card-header-empty"><span style="--nch:' + nch + '">' + esc(sc.name) + '</span></div>';
      return '<a class="collection-tile script-tile" href="' + esc(href) + '">' +
        headerHTML +
        '<h3 class="collection-name">' + esc(sc.name) + curataMark(sc) + draftMark(sc) + '</h3>' +
        '<div class="collection-footer">' +
          '<span class="collection-count">' + plural(n, 'character') + '</span>' +
          '<span class="collection-arrow">View &rarr;</span>' +
        '</div></a>';
    }
    function collectionTile(coll) {
      var name = coll.displayName || coll.slug;
      // Collections live at /collection/{kebab id} — the PK slug is a display
      // string on legacy rows, so always link the id.
      var href = '/collection/' + encodeURIComponent(coll.id || coll.slug);
      // Header image, then the author's logo — the same order the
      // collection's own page falls back through.
      var collBanner = coll.header || coll.logo;
      var topHTML = collBanner
        ? '<div class="collection-tile-header"><img loading="lazy" decoding="async" src="/assets/' + esc(collBanner) + '" alt="' + esc(name) + '"></div>'
        : '';
      // The blurb goes in the tagline paragraph, the same slot (and the same
      // three-line cutoff) every other collection tile on the site uses. It
      // used to be dropped into .collection-count, which is a small-caps
      // one-liner meant for "12 characters" — a collection whose description
      // runs to a paragraph turned the whole tile into a wall of capitals.
      var blurb = coll.tagline || coll.description || '';
      return '<a class="collection-tile" href="' + esc(href) + '">' +
        topHTML +
        '<h3 class="collection-name">' + esc(name) + curataMark(coll) + draftMark(coll) + '</h3>' +
        (blurb ? '<p class="collection-tile-tagline">' + esc(blurb) + '</p>' : '') +
        '<div class="collection-footer">' +
          '<span class="collection-count">' + esc(coll.author || 'Collection') + '</span>' +
          '<span class="collection-arrow">Browse &rarr;</span>' +
        '</div></a>';
    }
    function curataMark(x) {
      return x && x.curata
        ? ' <span class="curata-mark" role="img" title="Awarded by the wiki admins." aria-label="Curata"></span>' : '';
    }
    function draftMark(x) {
      return x && x.status === 'draft'
        ? ' <span class="draft-mark" title="Unpublished — only its owner and the admins can see this page.">Draft</span>' : '';
    }
    function pinCard(p, data) {
      var pool = p.type === 'character' ? data.characters
        : p.type === 'script' ? data.scripts : data.collections;
      var hit = null;
      for (var i = 0; i < pool.length; i++) if (pool[i].slug === p.slug) { hit = pool[i]; break; }
      if (!hit) return '';
      var href, thumb, name;
      if (p.type === 'character') {
        href = '/' + String(hit.page || ('c/' + hit.slug)).replace(/^\//, '');
        thumb = hit.art ? '/assets/' + hit.art : (hit.image || '/assets/favicon.png');
        name = hit.name;
      } else if (p.type === 'script') {
        href = '/s/' + encodeURIComponent(hit.slug);
        // header || logo, then the fallback — the same order the /s/ and
        // /collection/ pages themselves fall back through. Reading `header`
        // alone put the skull on every page with a logo and no header, which
        // is every Bloodstar import.
        thumb = hit.header ? '/assets/' + hit.header
              : hit.logo   ? '/assets/' + hit.logo : '/assets/favicon.png';
        name = hit.name;
      } else {
        href = '/collection/' + encodeURIComponent(hit.id || hit.slug);
        thumb = hit.header ? '/assets/' + hit.header
              : hit.logo   ? '/assets/' + hit.logo : '/assets/favicon.png';
        name = hit.displayName || hit.slug;
      }
      return '<a class="pin-card" href="' + esc(href) + '">' +
        '<img loading="lazy" decoding="async" class="pin-thumb" src="' + esc(thumb) +
        '" alt="" onerror="this.onerror=null;this.src=\'/assets/favicon.png\'">' +
        '<span class="pin-text"><span class="pin-name">' + esc(name) + '</span>' +
        '<span class="pin-kind">' + esc(p.type) + '</span></span></a>';
    }

    // Custom wiki pages this creator has written. They are unlisted everywhere
    // else on the site, so this and their parent page are the only ways in.
    function pageLink(p) {
      var parent = p.parentName
        ? ' <span class="wiki-pagelink-blurb" style="display:inline">· in ' + esc(p.parentName) + '</span>'
        : '';
      return '<a class="wiki-pagelink" href="/p/' + encodeURIComponent(p.slug) + '">' +
        '<span class="wiki-pagelink-title">' + esc(p.title) + '</span>' +
        (p.blurb ? '<span class="wiki-pagelink-blurb">' + esc(p.blurb) + parent + '</span>'
                 : (parent ? '<span class="wiki-pagelink-blurb">in ' + esc(p.parentName) + '</span>' : '')) +
        '</a>';
    }

    // `title` may carry markup (the Drafts heading has a badge), so it is not
    // escaped here — every caller passes a literal or an esc()'d value.
    /* `title` may carry markup (the Drafts heading has a pill in it), so the
       storage key is taken from the plain text. `count` is shown on the
       heading so a collapsed section still says how much is inside. */
    function section(title, inner, id, count) {
      var key = String(title).replace(/<[^>]*>/g, '').trim().toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || (id || 'section');
      var collapsed = sectionCollapsed(key);
      return '<section class="landing-section prof-section' + (collapsed ? ' collapsed' : '') + '"' +
        ' data-sec="' + esc(key) + '"' + (id ? ' id="' + id + '"' : '') + '>' +
        '<h2 class="type-header">' +
          '<button type="button" class="prof-sec-toggle" aria-expanded="' + (collapsed ? 'false' : 'true') + '">' +
            '<span class="prof-sec-caret" aria-hidden="true">\u25be</span>' +
            '<span>' + title + '</span>' +
            (count ? '<span class="prof-sec-count">' + esc(count) + '</span>' : '') +
          '</button>' +
        '</h2>' +
        '<div class="type-rule"></div>' +
        '<div class="prof-sec-body">' + inner + '</div></section>';
    }

    /* Which sections this reader has collapsed, per browser. Nothing is
       collapsed until they say so. */
    var SEC_KEY = 'botc_prof_sections';
    function readSections() {
      try { return JSON.parse(localStorage.getItem(SEC_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function sectionCollapsed(key) { return readSections()[key] === 1; }
    function setSectionCollapsed(key, on) {
      try {
        var all = readSections();
        if (on) all[key] = 1; else delete all[key];
        localStorage.setItem(SEC_KEY, JSON.stringify(all));
      } catch (e) { /* private mode: it just won't be remembered */ }
    }
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.prof-sec-toggle');
      if (!btn) return;
      var sec = btn.closest('.prof-section');
      if (!sec) return;
      var nowCollapsed = sec.classList.toggle('collapsed');
      btn.setAttribute('aria-expanded', nowCollapsed ? 'false' : 'true');
      setSectionCollapsed(sec.getAttribute('data-sec'), nowCollapsed);
    });

    /* ── hero ── */
    function renderHero(p, counts, me) {
      var claimed = !!p.claimed;
      var title = p.displayName || p.username || 'Creator';
      var avatarInner = p.avatarUrl
        ? '<img src="' + esc(p.avatarUrl) + '" alt="">'
        : esc(String(title).charAt(0).toUpperCase());

      var bits = [];
      if (counts.characters) bits.push(plural(counts.characters, 'character'));
      if (counts.scripts) bits.push(plural(counts.scripts, 'script'));
      if (counts.collections) bits.push(plural(counts.collections, 'collection'));
      if (counts.pages) bits.push(plural(counts.pages, 'page'));
      if (counts.drafts) bits.push(plural(counts.drafts, 'draft'));

      // Names this creator is credited under that are not just their profile
      // name — worth saying out loud, since it explains why those pages are here.
      var aka = (p.creatorNames || []).filter(function (n) {
        return n !== String(title).toLowerCase() && n !== String(p.username || '').toLowerCase();
      });

      var linksHTML = '';
      var L = p.links || {};
      var linkItems = [];
      if (L.website) linkItems.push('<li><a href="' + esc(L.website) + '" target="_blank" rel="noopener noreferrer nofollow"><span class="plink-icon">&#127760;</span>Website</a></li>');
      if (L.bluesky) linkItems.push('<li><a href="' + esc(L.bluesky) + '" target="_blank" rel="noopener noreferrer nofollow"><span class="plink-icon">&#9729;</span>Bluesky</a></li>');
      if (L.other) linkItems.push('<li><a href="' + esc(L.other) + '" target="_blank" rel="noopener noreferrer nofollow"><span class="plink-icon">&#128279;</span>Link</a></li>');
      if (L.discord) linkItems.push('<li><span><span class="plink-icon">&#128172;</span>' + esc(L.discord) + '</span></li>');
      if (linkItems.length) linksHTML = '<ul class="profile-links">' + linkItems.join('') + '</ul>';

      var btns = [];
      if (me && me.loggedIn && claimed) {
        if ((me.username || '').toLowerCase() === String(p.username || '').toLowerCase()) {
          btns.push('<a class="profile-msg-btn ghost" href="/account">&#9998; Edit your profile</a>');
        } else {
          btns.push('<a class="profile-msg-btn" href="/messages?to=' + encodeURIComponent(p.username) +
            '">&#9993; Message ' + esc(p.displayName || p.username) + '</a>');
        }
      }
      if (me && me.isAdmin) {
        btns.push('<a class="profile-msg-btn ghost" href="/dashboard">&#9881; Dashboard</a>');
      }

      hero.innerHTML =
        '<div class="profile-avatar">' + avatarInner + '</div>' +
        '<div class="profile-hero-text">' +
          '<h1>' + esc(title) + '</h1>' +
          '<p class="profile-uname">' +
            (claimed ? '@' + esc(p.username) : 'Creator') +
            (bits.length ? ' &middot; ' + bits.join(' &middot; ') : '') + '</p>' +
          (aka.length ? '<p class="profile-aka">Also credited as ' + esc(aka.join(', ')) + '</p>' : '') +
          (claimed
            ? (p.bio ? '<p class="profile-bio">' + esc(p.bio) + '</p>' : '')
            : '<p class="profile-unclaimed">No wiki account is linked to this name yet. If these pages are yours, sign up and an admin can attach them to your account.</p>') +
          (claimed && p.joined ? '<p class="profile-joined">Member since ' + esc(fmtDate(p.joined)) + '</p>' : '') +
          linksHTML +
          (btns.length ? '<div class="profile-btn-row">' + btns.join('') + '</div>' : '') +
        '</div>';
      fitHeroName();

      if (me && me.isAdmin) renderAdminLinkBox(p);
    }

    // Admins can attach a creator name to an account (or detach it) from the
    // page where the mismatch is visible. Backed by POST /api/admin/creator-alias.
    function renderAdminLinkBox(p) {
      var name = (p.creatorNames && p.creatorNames[0]) || authorName || p.displayName || '';
      if (!name) return;
      var box = document.createElement('div');
      box.className = 'creator-link-box';
      box.innerHTML =
        '<strong>Admin:</strong> creator name &ldquo;' + esc(name) + '&rdquo; is ' +
        (p.claimed ? 'linked to <strong>@' + esc(p.username) + '</strong>.' : 'not linked to an account.') +
        '<form id="cl-form"><input id="cl-user" type="text" placeholder="username" value="' +
        esc(p.claimed ? p.username : '') + '" autocomplete="off">' +
        '<button type="submit">Link</button>' +
        '<button type="button" id="cl-clear">Decide by ownership</button></form>' +
        '<p class="creator-link-msg" id="cl-msg"></p>';
      hero.parentNode.appendChild(box);

      function post(body) {
        var msg = document.getElementById('cl-msg');
        msg.textContent = 'Saving…';
        fetch('/api/admin/creator-alias', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ name: name }, body))
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (res.error) { msg.style.color = '#e6a'; msg.textContent = res.error; return; }
          msg.style.color = '#9d9'; msg.textContent = 'Saved. Reloading…';
          location.reload();
        }).catch(function () { msg.style.color = '#e6a'; msg.textContent = 'Could not save.'; });
      }
      document.getElementById('cl-form').addEventListener('submit', function (e) {
        e.preventDefault();
        post({ username: document.getElementById('cl-user').value.trim() });
      });
      document.getElementById('cl-clear').addEventListener('click', function () { post({ clear: true }); });
    }

    /* ── body ── */
    function renderBody(data, me) {
      var p = data.profile;
      var drafts = data.drafts || { characters: [], scripts: [], collections: [] };
      var html = '';

      if ((p.pinned || []).length) {
        var pins = p.pinned.map(function (x) { return pinCard(x, data); }).filter(Boolean).join('');
        if (pins) html += section('Pinned', '<div class="pin-grid">' + pins + '</div>');
      }

      if (data.characters.length) {
        // Same card markup as a collection page, so card-filters.js can drive
        // it. /api/user returns newest-first, so index doubles as the
        // "recently added" ordering the sort menu needs.
        html += section('Characters',
          '<p class="coll-chars-count cr-chars-count" id="cr-chars-count"></p>' +
          PR.filterBoxHTML('cr') +
          '<div id="cr-grid">' + PR.renderRosterCards(data.characters, '/', orderMap(data.characters)) + '</div>',
          'sec-characters', data.characters.length);
      }
      if (data.scripts.length) {
        html += section('Scripts', '<div class="collections-grid">' +
          data.scripts.map(scriptTile).join('') + '</div>', 'sec-scripts', data.scripts.length);
      }
      if (data.collections.length) {
        html += section('Collections', '<div class="collections-grid">' +
          data.collections.map(collectionTile).join('') + '</div>', 'sec-collections', data.collections.length);
      }
      // Wiki pages are unlisted everywhere else, so this is one of only two
      // ways to reach them (the other is their parent script/collection page).
      if ((data.pages || []).length) {
        html += section('Pages', '<div class="wiki-pagelinks wiki-pagelinks-dark">' +
          data.pages.map(pageLink).join('') + '</div>', 'sec-pages', data.pages.length);
      }

      // Drafts, for the only two people who can act on them: the owner of the
      // profile and the admins. Clearly walled off so nobody mistakes an
      // unpublished page for a live one.
      var nDrafts = drafts.characters.length + drafts.scripts.length + drafts.collections.length;
      if (nDrafts) {
        var inner = '<p class="draft-note">Not visible to anyone but their owner and the admins.</p>';
        if (drafts.characters.length) {
          inner += '<div>' + PR.renderRosterCards(drafts.characters, '/') + '</div>';
        }
        if (drafts.scripts.length) {
          inner += '<div class="collections-grid">' + drafts.scripts.map(scriptTile).join('') + '</div>';
        }
        if (drafts.collections.length) {
          inner += '<div class="collections-grid">' + drafts.collections.map(collectionTile).join('') + '</div>';
        }
        html += section('Drafts <span class="draft-count">' +
          (me && me.isAdmin ? 'admins only' : 'only you') + '</span>', inner, 'drafts', nDrafts);
      }

      if (!html) {
        html = '<p class="profile-empty">' + esc(p.displayName || p.username) +
          ' hasn’t published anything yet.</p>';
      }
      panel.innerHTML = html;

      // Mount whenever there are characters at all, not past some threshold,
      // so the chips and sort work however short the list is.
      var mounted = window.mountCardFilters && window.mountCardFilters({
        grid: 'cr-grid', bar: 'cr-filter-bar',
        toggle: 'cr-filter-toggle', count: 'cr-chars-count',
        // Unlike the browse listings, a creator page shows Partial pages by
        // default: this is one person's body of work, and hiding half of it
        // read as the wiki losing their characters. The chip starts active
        // so a reader can still filter them out.
        partialChip: true, partialOn: true, curataChip: true
      });
      if (!mounted) {
        var f = document.getElementById('cr-filters');
        if (f) f.style.display = 'none';
        var c = document.getElementById('cr-chars-count');
        if (c) c.textContent = plural(data.characters.length, 'character');
      }
    }
    // /api/user hands back newest-first; the sort menu wants a bigger number
    // for a more recent page.
    function orderMap(list) {
      var m = {};
      for (var i = 0; i < list.length; i++) m[list[i].slug] = list.length - i;
      return m;
    }

    var qs = username ? 'u=' + encodeURIComponent(username) : 'a=' + encodeURIComponent(authorName);
    Promise.all([
      fetch('/api/user?' + qs, { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
      fetch('/api/me', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); }).catch(function () { return {}; })
    ]).then(function (both) {
      var data = both[0], me = both[1] || {};
      if (!data || data.error) { fail((data && data.error) || 'Could not load this creator.'); return; }
      var p = data.profile;
      document.title = (p.displayName || p.username || 'Creator') + ' — BOTC HomeBrew Wiki';
      var d = data.drafts || { characters: [], scripts: [], collections: [] };
      renderHero(p, {
        characters: data.characters.length,
        scripts: data.scripts.length,
        collections: data.collections.length,
        pages: (data.pages || []).length,
        drafts: d.characters.length + d.scripts.length + d.collections.length
      }, me);
      renderBody(data, me);
    }).catch(function () { fail('Could not load this creator.'); });
  })();
  </script>
  <script src="/assets/site.js"></script>
</body>
</html>
