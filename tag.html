<!DOCTYPE html>
<html lang="en" class="redesign-on">
<head>
<meta charset="UTF-8">
<script src="assets/data.js"></script>
<script src="assets/viewport.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag — BOTC HomeBrew Wiki</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/styles.css">
<!-- The feeds this page draws from start downloading here, while the
     stylesheet and scripts are still on their way, instead of after the
     scripts at the end of the body have run. `crossorigin` has to be there
     for the preload to match a plain fetch(). -->
<link rel="preload" href="characters.json?fields=grid" as="fetch" crossorigin="anonymous">
<link rel="stylesheet" href="assets/header-redesign.css">
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <a class="brand" href="/">
        <img class="brand-skull" src="assets/logo_skull.webp" alt="">
        <img class="brand-header-text" src="assets/headertext.png" alt="BOTC HomeBrew Wiki">
      </a>
      <img class="topbar-badge" src="assets/ccc-parchment.webp" alt="Community Created Content">
    </div>
    <nav class="crumb" aria-label="Primary">
      <a href="all-characters">All Characters</a>
      <a href="scripts">Scripts</a>
      <a href="all-collections">Collections</a>
      <a href="script">Script Builder</a>
    </nav>
    <div class="search-wrap" id="search-wrap">
      <input class="search-input" id="search-input" type="search" placeholder="Search the wiki…" autocomplete="off" enterkeyhint="search" aria-label="Search the wiki" aria-expanded="false" aria-haspopup="listbox">
      <div class="search-drop" id="search-drop" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>
  <nav class="nav-dropdown" id="nav-dropdown" aria-label="Mobile navigation">
    <div class="nav-dropdown-search">
      <input type="search" id="nav-search-input" placeholder="Search the wiki…" autocomplete="off" enterkeyhint="search" aria-label="Search the wiki">
    </div>
    <a href="/">Home</a>
    <a href="all-characters">All Characters</a>
    <a href="scripts">Scripts</a>
    <a href="all-collections">Collections</a>
    <a href="script">Script Builder</a>
  </nav>

  <div class="home-hero">
    <h1 id="hero-title">Loading…</h1>
    <p id="hero-desc">Fan-made additions for Blood on the Clocktower</p>
  </div>

  <main class="home-panel list-panel" id="panel">
    <p style="text-align:center;color:rgba(236,225,200,.7);padding:30px">Loading characters…</p>
  </main>

  <p class="foot">Fan-made content for <em>Blood on the Clocktower</em> &middot; Not affiliated with The Pandemonium Institute</p>

  <script src="assets/tags.js"></script>
  <script src="assets/classify.js"></script>
  <script src="assets/favorites.js"></script>
  <script src="assets/card-actions.js"></script>
  <script src="assets/char-filters.js"></script>
  <script>
    function toTitleCase(s) {
      // hyphen-aware: "multi-kill" -> "Multi-Kill" (matches the canonical tags)
      return String(s || '').trim().toLowerCase()
        .replace(/(^|[\s\-\/])[a-z]/g, function(m) { return m.toUpperCase(); });
    }

    var rawTag = new URLSearchParams(location.search).get('t') || '';
    var displayTag = toTitleCase(rawTag);

    document.title = displayTag + ' — BOTC HomeBrew Wiki';
    document.getElementById('hero-title').textContent = displayTag;
    (function () {
      var d = window.describeTag && window.describeTag(displayTag);
      if (d) document.getElementById('hero-desc').textContent = d;
    })();
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;')
        .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function hasTag(c, tag) {
      return (c.tags || '').split(',').some(function(t) {
        return t.trim().toLowerCase() === tag.trim().toLowerCase();
      });
    }

    // The card is assets/char-filters.js's, the one All Characters and
    // /search draw, and the one the Worker drew this page's first screen with.
    function card(c) { return window.CharFilters.card(c); }
    var PANEL = document.getElementById('panel');
    // The Worker drew the first screen into this page (worker/list-pages.js);
    // the full list is fetched once the page is idle or the reader acts.
    var SSR = PANEL.getAttribute('data-ssr') === '1';

    function load(clicked) {
      BotcData.json('characters.json?fields=grid').then(function(list) {
        if (!rawTag) {
          PANEL.innerHTML = '<p style="text-align:center;color:rgba(236,225,200,.7);padding:30px">No tag specified. <a href="tags" style="color:#7fb2e6">Browse all tags</a>.</p>';
          return;
        }
        // Partial pages are listed like any other, as on All Characters.
        var chars = list.filter(function(c) { return hasTag(c, rawTag); });
        if (!chars.length) {
          PANEL.innerHTML = '<p style="text-align:center;color:rgba(236,225,200,.7);padding:30px">No characters found with tag <strong>' + esc(displayTag) + '</strong>. <a href="tags" style="color:#7fb2e6">Browse all tags</a>.</p>';
          return;
        }
        // One grid, drawn a screen at a time.
        var laid = window.CharFilters.singleGrid(chars);
        var adopt = SSR && PANEL.getAttribute('data-ssr-sig') === window.CharFilters.layoutSig(laid.groups);
        if (!adopt) PANEL.innerHTML = laid.html;
        window.mountCardBatches(PANEL, laid.groups, card, { adopt: adopt });
        if (clicked && clicked.isConnected) clicked.click();
      })
      .catch(function() {
        if (SSR) return;   // the first screen is still here
        PANEL.innerHTML =
          '<p style="text-align:center;color:#e6a;padding:30px">Could not load character list.</p>';
      });
    }
    // Every card is on the page already: nothing to fetch at all.
    if (SSR && !PANEL.querySelector('.card-load-more:not([hidden])')) { /* complete */ }
    else if (SSR) window.mountCardBatches.whenNeeded(PANEL, load);
    else load();
  </script>

  <script src="assets/site.js"></script>
</body>
</html>
