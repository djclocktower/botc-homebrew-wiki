  <!-- Fixed left sidebar -->


  <div class="home-hero">

  <div class="home-panel" style="padding-bottom:0">

    <div class="char-grid">
      <div class="skel skel-card" style="height:120px"></div>
      <div class="skel skel-card" style="height:120px"></div>

  <p class="foot">Fan-made content for <em>Blood on the Clocktower</em> &middot; Not affiliated with The Pandemonium Institute</p>

  <script src="assets/reader.js"></script>
  <!-- splitCreators() lives here — the single source of truth for how one
       `creator` string names several people. This page used to get it as a
       side effect of loading the whole of render.js; reading pages load
       reader.js now, which does not carry it, so the creator filter (and with
       it the whole card list) died on an undefined function. -->
  <script src="assets/creators.js"></script>
  <script src="assets/tags.js"></script>
  <script src="assets/classify.js"></script>
  <script src="assets/favorites.js"></script>
  <script src="assets/card-actions.js"></script>
  <script src="assets/char-filters.js"></script>
  <script>
    var TEAMS = [
      ['townsfolk', 'Townsfolk'], ['outsider', 'Outsider'],
      ['minion', 'Minion'], ['demon', 'Demon'],
      ['traveller', 'Traveller'], ['fabled', 'Fabled'],
      ['loric', 'Loric']
    ];
    var GOOD = { townsfolk: 1, outsider: 1 };
    window.TEAM_LABEL = window.TEAM_LABEL || {
      townsfolk: 'Townsfolk', outsider: 'Outsider', minion: 'Minion',
      demon: 'Demon', traveller: 'Traveller', fabled: 'Fabled', loric: 'Loric'
    };
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    // One character card; the markup lives in char-filters.js so the /search
    // page draws exactly the same card.
    function card(c) { return window.CharFilters.card(c); }
    function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); }
    // Collection definitions are loaded from collections.json (built live
    // from D1); a "Standalone" pseudo-collection is appended after the fetch.
    var AC_COLLECTIONS = [];
    // Resolve a collection param to its definition using slug or match arrays
    function findCollection(param) {
      if (!param) return null;
      var n = norm(param);
      for (var i = 0; i < AC_COLLECTIONS.length; i++) {
        var c = AC_COLLECTIONS[i];
        if (norm(c.slug) === n || norm(c.displayName) === n) return c;
        if (c.match.indexOf(n) !== -1) return c;
      }
      return null;
    }
    // Hybrid membership: a character belongs if its "Appears in" matches a
    // collection's match[] OR it's explicitly in include[], minus exclude[].
    // The rule lives in char-filters.js, which the Source chips use too.
    function inCollection(c, coll) { return window.CharFilters.inCollection(c, coll); }
    function charMatchesCollection(c, coll) {
      if (!coll) return true;
      if (coll.slug === 'Standalone') {
        // standalone = belongs to no recognized collection
        for (var i = 0; i < AC_COLLECTIONS.length - 1; i++) {  // skip Standalone itself
          if (inCollection(c, AC_COLLECTIONS[i])) return false;
        }
        return true;
      }
      return inCollection(c, coll);
    }
    var COLLECTION_PARAM = (function(){
      try { var p = new URLSearchParams(location.search).get('collection'); return p ? decodeURIComponent(p) : null; }
      catch (e) { return null; }
    })();

    // The filter box (team, tag, source, status and creator chips, sort and
    // group) is assets/char-filters.js, shared with the /search page.
    var FILTERS = null;
    var FULL = [];   // collection-scoped full list

    function render(){
      // Disconnect previous batches even when the new result is empty.
      if (cancelCards) cancelCards();
      var list = FILTERS.apply(FULL);
      var panel = document.getElementById('panel');
      var count = document.getElementById('filter-count');
      count.hidden = false;
      count.textContent = list.length + ' character' + (list.length===1?'':'s') +
        (FULL.length !== list.length ? ' (of ' + FULL.length + ')' : '');

      if (!list.length){
        panel.innerHTML = '<p style="text-align:center;color:rgba(236,225,200,.6);padding:40px">No characters match these filters. <button type="button" class="filter-reset" onclick="document.getElementById(\'fc-reset\').click()">Reset</button></p>';
        return;
      }
      // Team sections, one grid, or author sections: CharFilters.sections()
      // is the one layout, shared with /search.
      if (!SET_OF) SET_OF = window.CharFilters.makeSetOf(AC_COLLECTIONS, AC_SCRIPTS);
      var laid = window.CharFilters.sections(list, FILTERS.state.group, SET_OF);
      panel.innerHTML = laid.html;
      cancelCards = window.mountCardBatches(panel, laid.groups, card);
    }
    var cancelCards = null;
    // "Group: By script or collection" — built once, from the same two feeds
    // the Source chips use.
    var SET_OF = null, AC_SCRIPTS = [];

    Promise.all([
      BotcData.json('collections.json?fields=browse').catch(function(){return[];}),
      BotcData.json('characters.json?fields=grid'),
      BotcData.json('scripts.json?fields=browse').catch(function(){return[];})
    ]).then(function(res){
      var collData = res[0]||[], list = res[1], scripts = res[2]||[];
      AC_SCRIPTS = scripts;
      AC_COLLECTIONS = collData.map(function(c){
        return {id:c.id,slug:c.slug,displayName:c.displayName||c.slug,
                match:c.match||[],description:c.description||'',header:c.header||'',
                tagline:c.tagline||'',include:c.include||[],exclude:c.exclude||[],v:c.v};
      });
      AC_COLLECTIONS.push({id:'standalone',slug:'Standalone',displayName:'Standalone Characters',
                           match:[],standalone:true,description:'',header:''});
                var activeCollection = findCollection(COLLECTION_PARAM);
        // The per-collection browse/filter view now lives on the collection
        // page itself, so send real collections there. (Standalone stays here.)
        if (activeCollection && activeCollection.id && !activeCollection.standalone) {
          location.replace('collection/' + encodeURIComponent(activeCollection.id));
          return;
        }
        if (activeCollection) {
          list = list.filter(function (c) { return charMatchesCollection(c, activeCollection); });
          var displayName = activeCollection.displayName;
          var t = document.getElementById('hero-title');
          var st = document.getElementById('hero-subtitle');
          var cr = document.getElementById('crumb-here');
          if (t) t.textContent = displayName;
          if (st) st.textContent = list.length + ' character' + (list.length === 1 ? '' : 's') + ' in this collection';
          if (cr) cr.textContent = displayName;
          document.title = displayName + ' — BOTC HomeBrew Wiki';
          // Build a dedicated, centered collection hero block
          var hero = document.querySelector('.home-hero');
          if (hero) {
            var heroTitle = document.getElementById('hero-title');
            var heroSub = document.getElementById('hero-subtitle');
            if (heroSub) heroSub.style.display = 'none';
            var stack = document.createElement('div');
            stack.className = 'collection-hero';
            var inner = '';
            if (activeCollection.header) {
              var headerSrc = /^https?:\/\//i.test(activeCollection.header) ? activeCollection.header : 'assets/' + activeCollection.header + (activeCollection.v ? '?v=' + encodeURIComponent(activeCollection.v) : '');
              inner += '<div class="collection-hero-header"><img decoding="async" class="collection-hero-img" src="' + esc(headerSrc) + '" alt="' + esc(displayName) + '"></div>';
            }
            if (activeCollection.tagline) {
              inner += '<p class="collection-hero-tagline">' + esc(activeCollection.tagline) + '</p>';
            }
            if (activeCollection.description) {
              inner += '<p class="collection-hero-desc">' + esc(activeCollection.description) + '</p>';
            }
            inner += '<p class="collection-hero-count">' + list.length + ' character' + (list.length === 1 ? '' : 's') + ' in this collection</p>';
            if (activeCollection.id && !activeCollection.standalone) {
              inner += '<a class="cta-secondary" style="margin-top:6px" href="collection/' + encodeURIComponent(activeCollection.id) + '"><span class="ico ico-book" aria-hidden="true"></span> View collection page</a>';
            }
            inner += '<a class="cta-secondary" style="margin-top:6px" href="tokens?collection=' + encodeURIComponent(activeCollection.slug) + '">Print Tokens</a>';
            if (activeCollection.id && !activeCollection.standalone) {
              inner += '<a class="cta-secondary collection-edit-btn" href="publish-collection?c=' + encodeURIComponent(activeCollection.id) + '"><span class="ico ico-edit" aria-hidden="true"></span> Edit Collection</a>';
            }
            // Full collection JSON (official script-tool schema, every character).
            // This page draws from the GRID feed, which has none of the schema
            // fields (reminders, night order, jinx text…), so the JSON is built
            // from the CARD feed — fetched once, and only when somebody actually
            // reaches for the box (opens it, hovers it, copies or downloads).
            // Building it eagerly meant every collection view paid for 400 KB
            // of data to fill a box most readers never open.
            var collJsonText = '';
            var collJsonLoad = null;
            function buildCollJson(cards) {
              var want = {}; list.forEach(function (c) { want[c.slug] = true; });
              var rows = cards.filter(function (c) { return want[c.slug]; });
              var meta = { id: '_meta', name: displayName };
              var teamOrder = {}; TEAMS.forEach(function (t, i) { teamOrder[t[0]] = i; });
              rows.sort(function (a, b) {
                var ta = teamOrder[a.team] != null ? teamOrder[a.team] : 99;
                var tb = teamOrder[b.team] != null ? teamOrder[b.team] : 99;
                return ta !== tb ? ta - tb : (a.name || '').localeCompare(b.name || '');
              });
              return JSON.stringify([meta].concat(rows.map(window.buildSchema)), null, 2);
            }
            function ensureCollJson() {
              if (collJsonLoad) return collJsonLoad;
              collJsonLoad = Promise.all([BotcData.json('characters.json?fields=card'), BotcData.script('render.js')])
                .then(function (loaded) {
                  var cards = loaded[0];
                  collJsonText = buildCollJson(cards || []);
                  var code = stack.querySelector('.collection-json code');
                  if (code) code.textContent = collJsonText;
                  var cdl2 = stack.querySelector('#coll-json-download');
                  if (cdl2) cdl2.href = URL.createObjectURL(new Blob([collJsonText], { type: 'application/json' }));
                  var cp = stack.querySelector('.collection-json .json-copy');
                  if (cp) { cp.disabled = false; cp.textContent = 'Copy JSON'; }
                  return collJsonText;
                })
                .catch(function () {
                  collJsonLoad = null;
                  var code = stack.querySelector('.collection-json code');
                  if (code) code.textContent = 'Could not load the character data. Try again.';
                });
              return collJsonLoad;
            }
            if (list.length) {
              inner += '<div class="collection-json">' +
                '<div class="json-box">' +
                  '<div class="json-bar">' +
                    '<span class="json-bar-toggle" role="button" tabindex="0" aria-expanded="false">Collection JSON (all ' + list.length + ' characters) <span class="json-arrow">&#9662;</span></span>' +
                    '<button type="button" class="json-copy" disabled>Copy JSON</button>' +
                  '</div>' +
                  '<pre class="json-body" hidden><code>Loading the full character data…</code></pre>' +
                '</div>' +
                '<a class="cta-secondary" style="display:inline-block;margin-top:10px" href="#" id="coll-json-download"><span class="ico ico-download" aria-hidden="true"></span> Download JSON</a>' +
              '</div>';
            }
            stack.innerHTML = inner;
            // A real download link rather than a click handler over href="#":
            // when a synthetic-click download doesn't take, the bare "#" runs
            // instead and the tap just jumps to the top of the page. Same fix
            // as the SSR collection pages (assets/pageview.js).
            var cdl = stack.querySelector('#coll-json-download');
            var cjBox = stack.querySelector('.collection-json');
            if (cjBox) {
              // Start the load as soon as the reader shows interest in the box;
              // opening it, or copying, also starts it.
              ['pointerenter', 'touchstart', 'focusin'].forEach(function (ev) {
                cjBox.addEventListener(ev, function () { ensureCollJson(); }, { passive: true, once: true });
              });
              cjBox.addEventListener('click', function (e) {
                if (e.target.closest && e.target.closest('.json-bar-toggle, .json-copy')) ensureCollJson();
              }, true);
            }
            if (cdl) {
              // The download waits for the data: a click before it is here
              // loads it and then downloads, rather than saving a placeholder.
              cdl.addEventListener('click', function (e) {
                if (collJsonText) return;
                e.preventDefault();
                ensureCollJson().then(function (txt) { if (txt) cdl.click(); });
              });
              cdl.setAttribute('download', (activeCollection.id || norm(displayName) || 'collection') + '.json');
              if (!('download' in document.createElement('a'))) {
                cdl.target = '_blank'; cdl.rel = 'noopener';
              }
            }
            // place the stack right after the title
            if (heroTitle && heroTitle.nextSibling) hero.insertBefore(stack, heroTitle.nextSibling);
            else hero.appendChild(stack);
            // we replaced the subtitle's character-count text, so clear it
            if (heroSub) heroSub.textContent = '';
          }
        }
        FULL = list;
        FILTERS = window.CharFilters.mount({
          bar: document.getElementById('filter-bar'),
          toggle: document.getElementById('filter-toggle'),
          list: list,
          // A character on a collection counts as From Collection before it
          // counts as From Script.
          sourceOf: window.CharFilters.makeSourceOf(AC_COLLECTIONS, scripts),
          onChange: render
        });
        render();
      })
      .catch(function () {
        document.getElementById('panel').innerHTML =
          '<p style="text-align:center;color:#e6a;padding:30px">Could not load character list.</p>';
      });
  </script>

  <script src="assets/site.js"></script>
</body>
