<!DOCTYPE html>
<html lang="en" class="redesign-on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Author — BOTC HomeBrew Wiki</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/header-redesign.css">
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <a class="brand" href="/">
        <img class="brand-skull" src="assets/logo_skull.png" alt="">
        <img class="brand-header-text" src="assets/headertext.png" alt="BOTC HomeBrew Wiki">
      </a>
      <img class="topbar-badge" src="assets/ccc-parchment.png" alt="Community Created Content">
    </div>
    <nav class="crumb" aria-label="Primary">
      <a href="all-characters">All Characters</a>
      <a href="scripts">Scripts</a>
      <a href="all-collections">Collections</a>
      <a href="script">Script Builder</a>
    </nav>
    <div class="search-wrap" id="search-wrap">
      <input class="search-input" id="search-input" type="search" placeholder="Search characters…" autocomplete="off" aria-label="Search characters" aria-expanded="false" aria-haspopup="listbox">
      <div class="search-drop" id="search-drop" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>
  <nav class="nav-dropdown" id="nav-dropdown" aria-label="Mobile navigation">
    <div class="nav-dropdown-search">
      <input type="search" id="nav-search-input" placeholder="Search characters…" autocomplete="off">
    </div>
    <a href="/">Home</a>
    <a href="all-characters">All Characters</a>
    <a href="scripts">Scripts</a>
    <a href="all-collections">Collections</a>
    <a href="script">Script Builder</a>
  </nav>

  <div class="home-hero">
    <h1 id="hero-title">Loading…</h1>
    <p id="hero-sub">Fan-made additions for Blood on the Clocktower</p>
  </div>

  <main class="home-panel" id="panel">
    <p style="text-align:center;color:rgba(236,225,200,.7);padding:30px">Loading characters…</p>
  </main>

  <p class="foot">Fan-made content for <em>Blood on the Clocktower</em> &middot; Not affiliated with The Pandemonium Institute</p>

  <script src="assets/classify.js"></script>
  <script>
    var GOOD = { townsfolk: 1, outsider: 1 };
    var TEAM_LABEL = {
      townsfolk: 'Townsfolk', outsider: 'Outsider', minion: 'Minion',
      demon: 'Demon', traveller: 'Traveller', fabled: 'Fabled', loric: 'Loric'
    };

    var rawAuthor = new URLSearchParams(location.search).get('a') || '';

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;')
        .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function byAuthor(c, name) {
      return (c.creator || '').trim().toLowerCase() === name.toLowerCase();
    }

    function card(c) {
      var typeClass = GOOD[c.team] ? ' good' : '';
      var isDraft = c.status === 'draft';
      return '<a class="char-card' + (isDraft ? ' char-card-draft' : '') + '" href="' + esc(c.page) + '">' +
        '<img loading="lazy" decoding="async" class="char-card-thumb" src="' + esc(c.art ? 'assets/' + c.art : (typeof c.image === 'string' && c.image ? c.image : 'assets/favicon.png')) + '" alt="' + esc(c.name) + ' art">' +
        '<div class="char-card-info">' +
        '<div class="char-card-name">' + esc(c.name) +
          (isDraft ? '<span class="draft-mark" title="Unpublished — only its owner and the admins can see this page.">Draft</span>' : '') +
          window.classBadgeHTML(window.classifyCharacter(c), { from: c.starlightFrom }) + '</div>' +
        '<div class="char-card-type' + typeClass + '">' + esc(TEAM_LABEL[c.team] || c.team) + '</div>' +
        '<div class="char-card-ability">' + esc(c.ability || '') + '</div>' +
        '<span class="char-card-link">View Character →</span>' +
        '</div></a>';
    }

    // Admins get this author's unpublished pages too, marked as drafts.
    // ?drafts=1 is admin-gated server-side; a non-admin asking for it just
    // gets the ordinary published feed, so this needs no permission check of
    // its own — the /api/me call only decides whether to bother asking.
    fetch('/api/me', { credentials: 'same-origin' })
      .then(function(r) { return r.json(); })
      .catch(function() { return {}; })
      .then(function(me) {
        var isAdmin = !!(me && me.isAdmin);
        return fetch('characters.json' + (isAdmin ? '?drafts=1&_=' : '?_=') + Date.now(),
                     { credentials: 'same-origin' })
          .then(function(r) { return r.json(); })
          .then(function(list) { render(list); });
      })
      .catch(function() {
        document.getElementById('panel').innerHTML =
          '<p style="text-align:center;color:#e6a;padding:30px">Could not load character list.</p>';
      });

    function render(list) {
        var panel = document.getElementById('panel');
        if (!rawAuthor) {
          panel.innerHTML = '<p style="text-align:center;color:rgba(236,225,200,.7);padding:30px">No author specified. <a href="authors" style="color:#7fb2e6">Browse all authors</a>.</p>';
          return;
        }

        var mine = list.filter(function(c) { return byAuthor(c, rawAuthor); });
        // Unfinished (Partial) pages stay out of the author listings. Drafts
        // are separated out so they never pad the public character count.
        var drafts = mine.filter(function(c) { return c.status === 'draft'; });
        var chars = window.eligible(mine).filter(function(c) { return c.status !== 'draft'; });

        // Use the capitalisation from the first matching character
        var named = chars.length ? chars : drafts;
        var displayName = named.length ? named[0].creator.trim() : rawAuthor;
        var count = chars.length;

        document.title = displayName + ' — BOTC HomeBrew Wiki';
        document.getElementById('hero-title').textContent = displayName;
        document.getElementById('hero-sub').textContent =
          (count === 1 ? '1 character' : count + ' characters') +
          (drafts.length ? ' · ' + drafts.length + ' draft' + (drafts.length === 1 ? '' : 's') : '');

        if (!chars.length && !drafts.length) {
          panel.innerHTML = '<p style="text-align:center;color:rgba(236,225,200,.7);padding:30px">No characters found for <strong>' + esc(displayName) + '</strong>. <a href="authors" style="color:#7fb2e6">Browse all authors</a>.</p>';
          return;
        }

        var html = '';
        if (chars.length) {
          html += '<div class="type-section"><div class="char-grid">' +
            chars.map(card).join('') + '</div></div>';
        }
        // Drafts get their own clearly-labelled section at the bottom, so an
        // admin is never unsure which pages the public can actually see.
        if (drafts.length) {
          html += '<section class="type-section" id="drafts">' +
            '<h2 class="type-header">Drafts <span class="draft-count">admins only</span></h2>' +
            '<div class="type-rule"></div>' +
            '<p class="draft-note">Not visible to anyone but their owner and the admins.</p>' +
            '<div class="char-grid">' + drafts.map(card).join('') + '</div></section>';
        }
        panel.innerHTML = html;
    }
  </script>

  <script src="assets/site.js"></script>
</body>
</html>
